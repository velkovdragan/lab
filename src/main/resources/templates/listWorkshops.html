<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Workshop Registration - Choose a Workshop</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        .workshop-option {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .workshop-option:hover {
            background-color: #f5f5f5;
        }
        .error {
            color: red;
        }
        .workshops-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .workshops-table th, .workshops-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .workshops-table th {
            background-color: #f5f5f5;
        }
        form.inline {
            display: inline;
            margin: 0;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Workshop Registration App</h1>
</header>
<main>
    <!-- Display the errorMessage here (only if it exists), using the "error" class -->
    <p class="error" th:if="${errorMessage != null}" th:text="'Error: ' + ${errorMessage}"></p>

    <form action="/workshops" method="GET">
        <h2>Search workshops:</h2>
        <label>Title or category contains:</label>
        <input type="text" name="text">
        <label>Max price:</label>
        <input type="number" name="maxPrice" min="0" step="0.01">
        <input type="submit" value="Search">
    </form>

    <!-- Workshops table with Edit / Delete buttons.
         It is OUTSIDE the registration form, because HTML does not allow a form inside a form. -->
    <h2>All workshops:</h2>
    <p><a class="button" href="/workshops/workshop-form">+ Add new workshop</a></p>
    <table class="workshops-table">
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Price (MKD)</th>
            <th>Free seats</th>
            <th>Instructor</th>
            <th>Actions</th>
        </tr>
        <tr th:each="workshop : ${workshops}">
            <td th:text="${workshop.title}"></td>
            <td th:text="${workshop.category}"></td>
            <td th:text="${workshop.price}"></td>
            <td th:text="${workshop.capacity}"></td>
            <td th:text="${workshop.instructor.name} + ' ' + ${workshop.instructor.surname}"></td>
            <td>
                <a class="button" th:href="@{/workshops/workshop-form/{id}(id=${workshop.id})}">Edit</a>
                <form th:action="@{/workshops/delete/{id}(id=${workshop.id})}" method="POST" class="inline">
                    <input type="submit" value="Delete">
                </form>
            </td>
        </tr>
    </table>

    <form action="/registration" method="POST">
        <h2>Choose a workshop:</h2>
        <!-- Display a radio button for each workshop,0
             the value should be the workshop title
             and the displayed text should be:
             Title: <title>, Category: <category>, Price: <price> MKD, Free seats: <capacity>
             Workshops with 0 free seats are shown, but their radio button is disabled -->

        <div th:each="workshop : ${workshops}" class="workshop-option">
            <label>
                <input type="radio"
                       name="workshopTitle"
                       th:value="${workshop.title}"
                       th:disabled="${workshop.capacity == 0}"
                       required>

                <span th:text="|Title: ${workshop.title}, Category: ${workshop.category}, Price: ${workshop.price} MKD, Free seats: ${workshop.capacity}, Instructor: ${workshop.instructor.name} ${workshop.instructor.surname}|">
            </span>
            </label>
        </div>

        <h2>Enter your information:</h2>
        <label>Your Name:</label>
        <input type="text" name="participantName" required><br/>
        <label>Your Email:</label>
        <input type="email" name="participantEmail" required><br/>

        <h2>Choose number of seats:</h2>
        <input type="number" name="numSeats" min="1" required><br/>
        <br/>
        <input type="submit" value="Register">
    </form>
</main>
</body>
</html>
